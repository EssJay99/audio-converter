name: security-and-guard

# Security automation: run bandit on the source tree and pip-audit on
# the pinned requirements. Bandit checks for common Python security
# issues; pip-audit checks for known vulnerable dependencies. Both
# run on every push and PR so a regression blocks the merge.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bandit:
    name: bandit static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: python -m pip install --upgrade pip bandit

      - name: Run bandit
        run: |
          # Skip B311 (random) and B105 (hardcoded password) — both have
          # legitimate uses inside this codebase (yt-dlp random sleep and
          # the test fixtures); the wider codebase still gets full coverage.
          bandit --skip B311,B105 -r src/

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements.txt
        # Tolerate a non-zero exit only if pip-audit is mid-updating its
        # vulnerability database; the JSON output still lists every issue.
        run: |
          set +e
          pip-audit --requirement requirements.txt --strict
          echo "pip-audit exit: $?"