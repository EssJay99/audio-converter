name: build-installers

# Build a ready-to-install package on each OS (PyInstaller cannot
# cross-compile, so every platform builds natively here).
# Pushes to main and PRs trigger the matrix build (tests run as the
# first job) so a regression blocks the merge before the slow
# installers spin up. Manual dispatch and tag pushes also publish a
# GitHub Release with all three installers attached.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            installer: 'dist/*.dmg'
          - os: ubuntu-22.04
            installer: 'dist/*.tar.gz'
          - os: windows-latest
            installer: 'dist/*.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          python -m pip install pyinstaller pytest
        if: runner.os != 'Linux'

      - name: Python dependencies (Linux)
        # pygobject needs a newer gobject stack than CI images carry to
        # *compile*, but nothing at build/test time imports it: the desktop
        # window falls back to the browser without it, and end users get it
        # via their distro package (see the Linux install notes).
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          grep -v '^pygobject' requirements-desktop.txt > /tmp/requirements-desktop-ci.txt
          python -m pip install -r /tmp/requirements-desktop-ci.txt

      - name: FFmpeg for tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: FFmpeg for tests (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: FFmpeg for tests (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          # Absent until the repo owner adds a Developer ID: without them
          # the notarize script self-skips and the build stays unsigned.
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          bash scripts/build_macos.sh
          bash scripts/build_dmg.sh

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build_linux.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          # Absent until the repo owner adds a code-signing cert: without
          # them the installer builds unsigned, exactly as before.
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts\build_windows.bat "${{ github.ref_name }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" * \
            --title "Audio Converter ${{ github.ref_name }}" \
            --notes "macOS (.dmg), Windows (Setup .exe), and Linux (.tar.gz) installers. No command line needed: open, install, double-click."

  verify-release:
    # Smoke-test the verified self-update flow end to end: download every
    # published asset exactly as the in-app updater would and check it
    # against SHA256SUMS.txt. A checksum failure here blocks nothing
    # retroactively, but fails the workflow loudly before users update.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify published installer checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_release.py "${{ github.ref_name }}"
