<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { padding-top: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 600px; text-align: center; margin-top: 50px; }
        .error-code { font-size: 120px; color: #6c757d; }
        .btn-primary { font-size: 1.2rem; padding: 0.75rem 3rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">500</div>
        <h2>{{ message or "Internal Server Error" }}</h2>
        <p class="lead text-muted">Something went wrong. Please try again later.</p>
        <a href="/" class="btn btn-primary mt-3">Go Home</a>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
